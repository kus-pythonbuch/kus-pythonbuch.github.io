name: MkDocs mit PDF deployen

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v5

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: MkDocs installieren
        run: |
          pip install mkdocs mkdocs-material

      - name: Pandoc installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc curl xz-utils

      - name: Typst und Schriften aus dem Cache laden
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin/typst
            ~/.local/share/fonts/source-sans
          key: tools-typst-v0.15.1-source-sans-3.052R

      - name: Typst installieren
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          VERSION=v0.15.1
          mkdir -p ~/.local/bin

          echo "Installiere Typst $VERSION"

          # GitHub-Downloads schlagen manchmal mit 504 fehl: mehrmals versuchen,
          # sonst Typst aus crates.io bauen.
          if curl -fL --retry 10 --retry-delay 30 --retry-all-errors \
              "https://github.com/typst/typst/releases/download/$VERSION/typst-x86_64-unknown-linux-musl.tar.xz" \
              -o typst.tar.xz; then
            tar -xf typst.tar.xz
            mv typst-x86_64-unknown-linux-musl/typst ~/.local/bin/typst
          else
            echo "Download fehlgeschlagen, baue Typst mit cargo"
            cargo install --locked typst-cli --version "${VERSION#v}" --root ~/.local
          fi

      - name: Source Sans installieren
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 10 --retry-delay 30 --retry-all-errors \
            https://github.com/adobe-fonts/source-sans/releases/download/3.052R/OTF-source-sans-3.052R.zip \
            -o source-sans.zip
          unzip -q source-sans.zip -d source-sans
          mkdir -p ~/.local/share/fonts/source-sans
          cp source-sans/OTF/*.otf ~/.local/share/fonts/source-sans/

      - name: Werkzeuge einrichten
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          ~/.local/bin/typst --version
          sudo apt-get install -y fonts-jetbrains-mono
          fc-cache -f

      - name: PDFs erstellen
        run: |
          cd docs
          mkdir -p assets/pdf

          for file in *.md; do
            filename=$(basename "$file" .md)

            if [ "$filename" != "index" ]; then
              echo "Erstelle PDF: $filename"

              pandoc "$file" \
                -o "assets/pdf/$filename.pdf" \
                --pdf-engine=typst \
                --template=../templates/schulskript.typ \
                --lua-filter=../filters/remove-pdf-download.lua \
                --resource-path=.
            fi
          done

      - name: MkDocs Website erstellen
        run: |
          mkdocs build

      - name: GitHub Pages Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: GitHub Pages deployen
        id: deployment
        uses: actions/deploy-pages@v4